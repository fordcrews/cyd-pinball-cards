; CYD Pinball Cards - ESP32-2432S028R ("Cheap Yellow Display")
; 2.8" 320x240 ILI9341 (HSPI) + XPT2046 resistive touch (VSPI) + USB serial

[platformio]
default_envs = cyd

[env:cyd]
; Arduino-ESP32 core 2.x (TFT_eSPI is most reliable on core 2.x)
platform = espressif32 @ ^6.9.0      ; verified with 6.13.0 (Arduino core 2.0.17)
board = esp32dev
framework = arduino
extra_scripts = pre:gen_wifi_secrets.py
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    bblanchon/ArduinoJson @ ^7.2.0

build_flags =
    ; ---- TFT_eSPI config (replaces User_Setup.h) ----
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1          ; if colours/offsets look wrong try -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1             ; display on HSPI, touch gets VSPI
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DDISABLE_ALL_LIBRARY_WARNINGS=1   ; silences the expected "TOUCH_CS not defined" warning (touch uses XPT2046_Touchscreen)
    ; ---- XPT2046 touch (separate VSPI bus) ----
    -DXPT2046_IRQ=36
    -DXPT2046_MOSI=32
    -DXPT2046_MISO=39
    -DXPT2046_CLK=25
    -DXPT2046_CS=33
    ; ---- App options ----
    ; ROTATION: 0/2 = portrait (240x320), 1/3 = landscape (320x240)
    -DCYD_ROTATION=1
    -DCARD_ROTATE_MS=12000
    -DDEFAULT_BRIGHTNESS=220

[env:waveshare_s3_lcd7]
; Waveshare ESP32-S3-Touch-LCD-7: 7" 800x480 RGB565 parallel IPS (ST7262), GT911 capacitive touch
; (I2C 0x5D, SDA 8 / SCL 9, INT 4), CH422G IO expander (I2C 0x24/0x38: EXIO1 TP_RST, EXIO2 backlight
; enable, EXIO3 LCD_RST, EXIO4 SD_CS, EXIO5 USB_SEL). ESP32-S3-WROOM-1 N16R8 / N8R8 (octal PSRAM).
; Pins/timings: https://www.waveshare.com/wiki/ESP32-S3-Touch-LCD-7 and Waveshare's demo
; (ESP32-S3-Touch-LCD-7-Demo.zip, 08_DrawColorBar / ESP-IDF 08_lvgl_Porting). See README.
platform = espressif32 @ ^6.9.0      ; verified with 6.13.0 (Arduino core 2.0.17)
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:gen_wifi_secrets.py
monitor_speed = 115200
upload_speed = 921600
board_build.arduino.memory_type = qio_opi   ; QIO flash + octal (OPI) PSRAM
board_build.flash_mode = qio
board_upload.flash_size = 8MB               ; works on both the 8 MB and the 16 MB module
board_build.partitions = default_8MB.csv
board_build.f_flash = 80000000L

lib_deps =
    lovyan03/LovyanGFX @ ^1.1.16
    bblanchon/ArduinoJson @ ^7.2.0

build_flags =
    -DBOARD_WS_S3_LCD7=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1          ; native USB = USB-Serial/JTAG (VID:PID 303A:1001)
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial = native USB CDC; UART0 (CH343 "UART" port) is read too
    ; ---- App options ----
    ; ROTATION (same meaning as on the CYD): 1/3 = landscape (800x480), 0/2 = portrait (480x800)
    -DCYD_ROTATION=1
    -DCARD_ROTATE_MS=12000
    -DDEFAULT_BRIGHTNESS=220
