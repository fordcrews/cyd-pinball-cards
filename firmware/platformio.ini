; CYD Pinball Cards - ESP32-2432S028R ("Cheap Yellow Display")
; 2.8" 320x240 ILI9341 (HSPI) + XPT2046 resistive touch (VSPI) + USB serial

[platformio]
default_envs = cyd

[env:cyd]
; Arduino-ESP32 core 2.x (TFT_eSPI is most reliable on core 2.x)
platform = espressif32 @ ^6.9.0      ; verified with 6.13.0 (Arduino core 2.0.17)
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    bblanchon/ArduinoJson @ ^7.2.0

build_flags =
    ; ---- TFT_eSPI config (replaces User_Setup.h) ----
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1          ; if colours/offsets look wrong try -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1             ; display on HSPI, touch gets VSPI
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DDISABLE_ALL_LIBRARY_WARNINGS=1   ; silences the expected "TOUCH_CS not defined" warning (touch uses XPT2046_Touchscreen)
    ; ---- XPT2046 touch (separate VSPI bus) ----
    -DXPT2046_IRQ=36
    -DXPT2046_MOSI=32
    -DXPT2046_MISO=39
    -DXPT2046_CLK=25
    -DXPT2046_CS=33
    ; ---- App options ----
    ; ROTATION: 0/2 = portrait (240x320), 1/3 = landscape (320x240)
    -DCYD_ROTATION=1
    -DCARD_ROTATE_MS=12000
    -DDEFAULT_BRIGHTNESS=220
